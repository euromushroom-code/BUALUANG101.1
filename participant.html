<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>โปรไฟล์ผู้เข้าร่วม — ดาวเด่นบัวหลวง 101</title><link rel="stylesheet" href="../css/style.css"></head><body>
<header class="site-header"><a class="brand" href="../index.html">ดาวเด่น<span>บัวหลวง 101</span></a><button class="menu-toggle" aria-label="เปิดเมนู">☰</button><nav><a href="about.html">โครงการ</a><a class="active" href="participants.html">ผู้เข้าร่วม</a><a href="activities.html">กิจกรรม</a><a href="news.html">ข่าวสาร</a><a href="contact.html">ติดต่อ</a></nav></header>
<main><section class="section profile-hero"><a class="back-link" href="participants.html">← กลับไปผู้เข้าร่วม</a><div id="profile"></div></section></main><footer><strong>ดาวเด่นบัวหลวง 101</strong><p>© 2026 Bualuang 101</p></footer>
<script src="../js/main.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
(async()=>{const id=new URLSearchParams(location.search).get('id');const box=document.getElementById('profile');try{const d=await (await fetch('../data/participants.json')).json();const x=(d.participants||[]).find(p=>String(p.id)===String(id));if(!x){box.innerHTML='<div class="empty-state"><div class="empty-icon">?</div><h2>ไม่พบโปรไฟล์</h2><p>ตรวจสอบรหัสผู้เข้าร่วมอีกครั้ง</p></div>';return}const tags=(x.style||[]).map(t=>`<span>${esc(t)}</span>`).join('');const works=(x.works||[]).map(w=>`<article class="work-card"><div class="work-placeholder">${esc(w.title||'ผลงาน')}</div><h3>${esc(w.title||'ไม่ระบุชื่อผลงาน')}</h3><p>${esc(w.year||'')}</p></article>`).join('');box.innerHTML=`<div class="profile-grid"><div class="profile-avatar">${esc((x.name||'').split(/\s+/).map(s=>s[0]).slice(0,2).join(''))}</div><div><p class="eyebrow">${esc(x.institution||'')}</p><h1>${esc(x.name||'')}</h1><p class="profile-meta">${esc([x.major,x.province].filter(Boolean).join(' · '))}</p><div class="tag-list">${tags}</div><p class="profile-bio">${esc(x.bio||'ยังไม่มีประวัติย่อ')}</p></div></div><div class="section-inner"><h2>ผลงาน</h2><div class="work-grid">${works||'<p class="muted">ยังไม่มีข้อมูลผลงาน</p>'}</div></div>`}catch(e){box.innerHTML='<div class="empty-state"><h2>โหลดข้อมูลไม่สำเร็จ</h2><p>ตรวจสอบไฟล์ data/participants.json</p></div>'}})();
</script></body></html>
